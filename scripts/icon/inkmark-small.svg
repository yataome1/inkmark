      <stop offset="0" stop-color="#4C94FF"/>
      <stop offset="1" stop-color="#2156DB"/>
    </linearGradient>
  </defs>
  <g transform="scale(9.142857)">
    <rect width="112" height="112" rx="22" fill="url(#bg)"/>
    <path d="M28 12H74L94 32V92a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8Z" fill="#FFFFFF"/>
    <path d="M74 12V26a6 6 0 0 0 6 6H94Z" fill="#B8CFF7"/>
    <g stroke="#2F6BEA" stroke-width="7" stroke-linecap="round">
      <line x1="43" y1="38" x2="40" y2="66"/>
      <line x1="56" y1="38" x2="53" y2="66"/>
      <line x1="32" y1="47" x2="65" y2="47"/>
      <line x1="31" y1="57" x2="64" y2="57"/>
