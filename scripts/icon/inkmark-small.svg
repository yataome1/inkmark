    <rect x="1.5" y="1.5" width="109" height="109" rx="22" fill="#FFFFFF" stroke="#C3CAD6" stroke-width="3"/>
    <g stroke="#2F6BEA" stroke-width="8.5" stroke-linecap="round">
      <line x1="44" y1="26" x2="41" y2="58"/>
      <line x1="58" y1="26" x2="55" y2="58"/>
      <line x1="31" y1="37" x2="67" y2="37"/>
      <line x1="30" y1="49" x2="66" y2="49"/>
    </g>
    <line x1="80" y1="26" x2="80" y2="58" stroke="#FF9F0A" stroke-width="8.5" stroke-linecap="round"/>
    <g stroke="#9DB7F2" stroke-width="8.5" stroke-linecap="round">
      <line x1="30" y1="74" x2="84" y2="74"/>
      <line x1="30" y1="88" x2="66" y2="88"/>
    </g>
  </g>
</svg>
