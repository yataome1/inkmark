<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Inkmark 图标（48px 及以上）：纯色底 + 单色图案。白底，蓝色 # 与文本行，橙色光标；全部为几何路径，不依赖字体 -->
  <g transform="scale(9.142857)">
    <!-- 浅灰描边：白色图标放在白色背景上时仍能看出轮廓 -->
    <rect x="0.5" y="0.5" width="111" height="111" rx="25" fill="#FFFFFF" stroke="#D5DAE3" stroke-width="1"/>
    <g stroke="#2F6BEA" stroke-width="7" stroke-linecap="round">
      <line x1="44" y1="28" x2="41" y2="58"/>
      <line x1="57" y1="28" x2="54" y2="58"/>
      <line x1="33" y1="38" x2="66" y2="38"/>
      <line x1="32" y1="49" x2="65" y2="49"/>
    </g>
    <line x1="78" y1="28" x2="78" y2="58" stroke="#FF9F0A" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#B4C8F5" stroke-width="7" stroke-linecap="round">
      <line x1="32" y1="72" x2="82" y2="72"/>
      <line x1="32" y1="84" x2="66" y2="84"/>
    </g>
  </g>
</svg>
