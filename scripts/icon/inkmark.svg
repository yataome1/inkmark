<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Inkmark 图标：一页文档，# 标题记号与光标。全部为几何路径，不依赖字体。48px 及以上使用 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C94FF"/>
      <stop offset="1" stop-color="#2156DB"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2FA"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE8FF"/>
      <stop offset="1" stop-color="#AFC8F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#0A2A78" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g transform="scale(9.142857)">
    <rect width="112" height="112" rx="25" fill="url(#bg)"/>
    <path d="M34 18H70L86 34V86a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8V26a8 8 0 0 1 8-8Z" fill="url(#paper)" filter="url(#shadow)"/>
