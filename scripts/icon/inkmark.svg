    <g stroke="#2F6BEA" stroke-width="4.2" stroke-linecap="round">
      <line x1="45.5" y1="40" x2="42.5" y2="61"/>
      <line x1="54.5" y1="40" x2="51.5" y2="61"/>
      <line x1="38" y1="47.5" x2="59.5" y2="47.5"/>
      <line x1="37" y1="54.5" x2="58.5" y2="54.5"/>
    </g>
    <line x1="66.5" y1="40" x2="66.5" y2="61" stroke="#FF9F0A" stroke-width="3.6" stroke-linecap="round"/>
    <g stroke="#C7D3E8" stroke-width="4" stroke-linecap="round">
      <line x1="38" y1="72" x2="74" y2="72"/>
      <line x1="38" y1="82" x2="62" y2="82"/>
