<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- CSP 由 src-tauri/tauri.conf.json 的 app.security.csp 统一设置 -->
    <title>Inkmark</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="vendor/highlight/github.min.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="vendor/highlight/github-dark.min.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <nav class="sidebar-tabs">
          <button data-tab="files">文件</button>
          <button data-tab="favorites">收藏</button>
          <button data-tab="outline">大纲</button>
        </nav>
        <section id="pane-files" class="pane">
          <div id="folder-name" class="folder-name" hidden><span class="name"></span><button class="star" aria-label="收藏"></button></div>
          <ul id="tree" class="tree"></ul>
          <button id="open-folder" class="link-button">打开文件夹…</button>
        </section>
        <section id="pane-favorites" class="pane">
          <ul id="favorites" class="tree favorites"></ul>
        </section>
        <section id="pane-outline" class="pane">
          <ul id="outline" class="outline"></ul>
        </section>
      </aside>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        title="拖动调整宽度，双击复位"
        tabindex="0"
      ></div>
      <main id="main">
        <div id="tabbar"></div>
        <div id="findbar" hidden>
          <input id="find-input" type="text" placeholder="查找" spellcheck="false" />
          <span id="find-count"></span>
          <button id="find-prev" title="上一个 (Shift+Enter)">↑</button>
          <button id="find-next" title="下一个 (Enter)">↓</button>
          <input id="replace-input" type="text" placeholder="替换为" spellcheck="false" />
          <button id="replace-all">全部替换</button>
          <button id="find-close" title="关闭 (Esc)">✕</button>
        </div>
        <div id="editor"></div>
        <div id="start-page" hidden></div>
        <footer id="statusbar">
          <span id="status-mode"></span>
          <span id="status-flags"></span>
          <span id="status-count"></span>
        </footer>
      </main>
    </div>
    <dialog id="about"></dialog>
    <script src="vendor/cm.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="text-utils.js"></script>
    <script src="doc-format.js"></script>
    <script src="markdown-html.js"></script>
    <script src="render.js"></script>
    <script src="table-utils.js"></script>
    <script src="table.js"></script>
    <script src="anchor.js"></script>
    <script src="live-preview.js"></script>
    <script src="find.js"></script>
    <script src="scrollbar.js"></script>
    <script src="editor.js"></script>
    <script src="platform.js"></script>
    <script src="contextmenu.js"></script>
    <script src="resizer.js"></script>
    <script src="favorites.js"></script>
    <script src="tab-utils.js"></script>
    <script src="tabs.js"></script>
    <script src="start-page.js"></script>
    <script src="shortcuts.js"></script>
    <script src="about.js"></script>
    <script src="export.js"></script>
    <script src="app.js"></script>
  </body>
</html>
