name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Windows 与 macOS 都必须通过（specs/015 NFR-1504）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run vendor
      - name: cargo fmt / clippy / test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write # 构建证明（specs/017 FR-1702）
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run dist
      - name: 收集产物并检查体积（宪章 VII / NFR-101）
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName "out/Inkmark-Setup-$v-x64.exe"
          Copy-Item src-tauri/target/release/inkmark.exe "out/Inkmark-$v-x64-portable.exe"
          $limits = @{ "Inkmark-Setup-$v-x64.exe" = 10MB; "Inkmark-$v-x64-portable.exe" = 15MB }
          foreach ($f in Get-ChildItem out) {
            "{0}: {1:N2} MB" -f $f.Name, ($f.Length / 1MB)
            if ($f.Length -gt $limits[$f.Name]) { throw "$($f.Name) 超过体积上限" }
          }
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*.exe
      - name: 生成 SHA-256 校验文件（specs/017 FR-1701）
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem out/*.exe) {
            $line = "{0}  {1}`n" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
            [IO.File]::WriteAllText("$($f.FullName).sha256", $line)
            Get-Content "$($f.FullName).sha256"
          }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.exe
            out/*.sha256
          generate_release_notes: true

  release-mac:
    # 在 Windows 发布之后运行，上传到同一个 Release，避免两个任务同时创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write # 构建证明（specs/017 FR-1702）
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run dist:mac
      - name: 收集产物并检查体积（宪章 VII / NFR-1501）
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Inkmark-$v-universal.dmg"
          size=$(stat -f %z "out/Inkmark-$v-universal.dmg")
          echo "Inkmark-$v-universal.dmg: $(echo "scale=2; $size/1048576" | bc) MB"
          if [ "$size" -gt 10485760 ]; then echo "超过 10MB 体积上限"; exit 1; fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*.dmg
      - name: 生成 SHA-256 校验文件（specs/017 FR-1701）
        working-directory: out
        run: |
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; cat "$f.sha256"; done
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.dmg
            out/*.sha256
