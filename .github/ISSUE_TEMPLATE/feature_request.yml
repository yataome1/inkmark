name: 功能建议
description: 提出新功能（采纳后将转为 specs/ 下的规格）
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: 用户故事
      placeholder: 作为……，我希望……，以便……
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收场景
      placeholder: 假设……，当……，那么……
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / 参考（如 Typora 对应功能）
