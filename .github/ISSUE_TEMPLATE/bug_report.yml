name: 问题报告
description: 报告 Inkmark 的缺陷
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Inkmark 版本
      description: 帮助 → 关于 Inkmark
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 输入 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 最小复现 Markdown
      render: markdown
