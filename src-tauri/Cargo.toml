[package]
name = "inkmark"
version = "0.1.0"
description = "A Typora-inspired local Markdown viewer & editor for Windows"
authors = ["yataome1 <zhangmian@outlook.com>"]
license = "MIT"
repository = "https://github.com/yataome1/inkmark"
edition = "2024"
rust-version = "1.90"

[lib]
name = "inkmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
windows-core = "0.62"

# 体积优化（宪章 VII）
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
