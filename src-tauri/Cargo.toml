[package]
name = "inkmark"
version = "0.8.0"
description = "An offline-first local Markdown viewer & editor for Windows and macOS"
authors = ["zhangmian"]
license = "MIT"
repository = "https://github.com/yataome1/inkmark"
edition = "2024"
rust-version = "1.90"

[lib]
name = "inkmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# macOS：wry 已依赖的系统框架绑定，只启用用到的部分（specs/015 plan）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

# 体积优化（宪章 VII）
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
